# Builds the plugin on Linux from the tagged commit and publishes a GitHub
# release with artifact attestations. Obsidian's community directory rebuilds
# every release from source and compares it with the released main.js, so
# releases are built here instead of on a local machine, where line endings
# and installed dependency versions can differ. The release notes are the
# section of CHANGELOG.md headed with the version.
#
# To release: add a "## <version>" section to CHANGELOG.md, set the same
# version in manifest.json, package.json and versions.json, commit and push,
# then push a tag with exactly that version (no "v"):
#   git tag 0.1.3 && git push origin 0.1.3

name: Release

on:
  push:
    tags:
      - "*"
  # Run it by hand from the Actions tab to check that the build works
  # without publishing anything.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches manifest.json
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - uses: actions/attest-build-provenance@v2
        if: github.ref_type == 'tag'
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v heading="## $GITHUB_REF_NAME" '$0 == heading { found = 1; next } /^## / { if (found) exit } found' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" main.js manifest.json --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json --title "$GITHUB_REF_NAME" --generate-notes
          fi
